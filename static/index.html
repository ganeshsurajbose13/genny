<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Market AI Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    margin:0;
    padding:14px;
}
h1,h2,h3,h4{color:#38bdf8;margin:6px 0}
input,button{
    padding:10px;
    font-size:14px;
}
input{width:160px}
button{
    cursor:pointer;
    background:#2563eb;
    border:none;
    color:white;
    border-radius:6px;
}
.card{
    background:#020617;
    padding:14px;
    border-radius:10px;
    margin-bottom:14px;
    box-shadow:0 0 12px rgba(0,0,0,0.45);
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:12px;
}
.badge{
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    display:inline-block;
}
.buy{background:#16a34a}
.sell{background:#dc2626}
.hold{background:#6b7280}
.small{font-size:12px;color:#94a3b8}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
}
td{
    padding:5px 6px;
    border-bottom:1px solid #1e293b;
}
@media(max-width:600px){
    input{width:100%}
    button{width:100%;margin-top:6px}
}
</style>
</head>

<body>

<h1>📈 Market AI Scanner</h1>

<div class="card">
    <input id="symbol" placeholder="RELIANCE.NS">
    <button onclick="analyze()">Analyze</button>
    <button onclick="loadScanner()">Scanner</button>
</div>

<div id="result"></div>

<script>
const API = ""; // same host

/* ---------- helpers ---------- */
function safeNum(v, d=2){
    if(v === undefined || v === null) return "-";
    const n = Number(v);
    if(isNaN(n)) return "-";
    return n.toFixed(d);
}
function badgeCls(s){
    if(!s) return "hold";
    s = s.toUpperCase();
    if(s.includes("BUY")) return "buy";
    if(s.includes("SELL")) return "sell";
    return "hold";
}

/* ---------- analyze ---------- */
async function analyze(sym){
    const symbol = sym || document.getElementById("symbol").value.trim();
    if(!symbol) return alert("Enter symbol");

    const res = await fetch(`${API}/analyze?symbol=${symbol}`);
    if(!res.ok) return alert("Analyze API error");

    const data = await res.json();
    renderAnalysis(data.primary_engine);
}

/* ---------- render analysis ---------- */
function renderAnalysis(p){
    let html = `
    <div class="card">
        <h2>${p.symbol}</h2>
        <span class="badge ${badgeCls(p.final_signal)}">${p.final_signal}</span>
        <p>Confidence:
            <b>${safeNum(p["confidence_score_%"],1)}%</b>
            (${p.confidence_band})
        </p>
        <p class="small">
            Daily: ${p.daily_trend} |
            Weekly: ${p.weekly_trend} |
            Monthly: ${p.monthly_trend}
        </p>
    </div>

    <div class="grid">
        ${renderTF("1D", p.analysis["1D"])}
        ${renderTF("4H", p.analysis["4H"])}
        ${renderTF("1H", p.analysis["1H"])}
    </div>
    `;
    document.getElementById("result").innerHTML = html;
}

/* ---------- timeframe block ---------- */
function renderTF(tf, d){
    if(!d) return "";
    return `
    <div class="card">
        <h3>${tf} Timeframe</h3>

        <table>
            <tr><td>Price</td><td>${safeNum(d.Price)}</td></tr>
            <tr><td>Volume</td><td>${d.Volume ?? "-"}</td></tr>
            <tr><td>VWAP</td><td>${safeNum(d.VWAP)}</td></tr>
            <tr><td>EMA 5</td><td>${safeNum(d.EMA5)}</td></tr>
            <tr><td>EMA 10</td><td>${safeNum(d.EMA10)}</td></tr>
            <tr><td>EMA 20</td><td>${safeNum(d.EMA20)}</td></tr>
            <tr><td>Bias</td><td>${d.Bias}</td></tr>
        </table>

        <h4>Indicators</h4>
        <table>
            <tr><td>RSI</td><td>${safeNum(d.Indicators.RSI)}</td></tr>
            <tr><td>MACD Hist</td><td>${safeNum(d.Indicators.MACD_hist,4)}</td></tr>
            <tr><td>Stochastic %K</td><td>${safeNum(d.Indicators["Stochastic_%K"])}</td></tr>
            <tr><td>ATR</td><td>${safeNum(d.Indicators.ATR)}</td></tr>
            <tr><td>Dow Theory</td><td>${d.Indicators.Dow_Theory}</td></tr>
            <tr><td>Wave Phase</td><td>${d.Indicators.Wave_Phase}</td></tr>
        </table>

        <h4>Risk</h4>
        <table>
            <tr><td>Stop Loss</td><td>${safeNum(d.risk.stop_loss)}</td></tr>
            <tr><td>Target</td><td>${safeNum(d.risk.target)}</td></tr>
        </table>
    </div>
    `;
}

/* ---------- scanner ---------- */
async function loadScanner(){
    const res = await fetch(`${API}/scanner`);
    if(!res.ok) return alert("Scanner API error");

    const data = await res.json();
    let html = `<div class="card"><h2>Scanner Results</h2></div><div class="grid">`;

    [...data.TOP_BUY, ...data.TOP_SELL].forEach(x=>{
        html += `
        <div class="card">
            <h3>${x.symbol}</h3>
            <span class="badge ${badgeCls(x.signal)}">${x.signal}</span>
            <p>Score: <b>${safeNum(x.score,1)}</b></p>
            <button onclick="analyze('${x.symbol}')">View</button>
        </div>`;
    });

    html += "</div>";
    document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
